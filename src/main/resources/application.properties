spring.application.name=StudyFlow

# Dynamic Port Binding for Render and Cloud Providers (Defaults to 8080 locally)
server.port=${PORT:8080}

# Database Configuration:
# In-Memory H2 for high speed and zero ephemeral disk locking on Render / Cloud containers.
# Persistent student data is safely stored client-side in the Browser's LocalStorage!
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:mem:studyflowdb;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console enabled for viva demonstration (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# SQL Schema initialization
spring.sql.init.mode=always

# Vaadin settings
vaadin.launch-browser=false
vaadin.allowed-packages=com.studyflow
